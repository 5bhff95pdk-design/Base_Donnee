name: Validation de la base

# Régénère tous les livrables à partir du classeur maître, vérifie que la
# génération est reproductible (zéro diff = pas d'horodatage volatile), puis
# lance les garde-fous de tests/test_base.py.

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Dépendances
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Régénération des livrables
        run: python construire_base.py

      - name: Reproductibilité (aucun diff après régénération)
        run: |
          echo "Versions:"; python - <<'PY'
          import PIL, openpyxl, sys
          print("python", sys.version.split()[0])
          print("Pillow", PIL.__version__)
          print("openpyxl", openpyxl.__version__)
          try:
              from PIL import features
              print("libwebp", features.version_module("webp"))
          except Exception as e:
              print("libwebp?", e)
          PY
          fichiers=$(git diff --name-only)
          if [ -n "$fichiers" ]; then
            echo "$fichiers" | while read -r f; do
              echo "::error file=${f}::la régénération modifie ce fichier (construction non reproductible)"
            done
            echo "---- résumé numstat ----"
            git diff --numstat
            echo "---- fin ----"
            exit 1
          fi
          echo "Aucun diff après régénération : construction reproductible."

      - name: Garde-fous (tests)
        run: python -m unittest discover -s tests -v
