name: Validation de la base

# Régénère tous les livrables à partir du classeur maître, vérifie que la
# génération est reproductible (zéro diff = pas d'horodatage volatile), puis
# lance les garde-fous de tests/test_base.py.

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dépendances
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Régénération des livrables
        run: python construire_base.py

      - name: Reproductibilité (aucun diff après régénération)
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::La régénération modifie des fichiers suivis: construction non reproductible (horodatage? ordre? gabarit?)"
            git diff
            exit 1
          fi

      - name: Garde-fous (tests)
        run: python -m unittest discover -s tests -v
