name: Validation de la base

# Régénère tous les livrables à partir de la source texte (data/*.csv), vérifie
# que la génération est reproductible (zéro diff = pas d'horodatage volatile),
# contrôle le style du code puis lance les garde-fous de tests/test_base.py.
#
# Exécution programmée : une dépendance qui casse (openpyxl, Pillow, runner)
# serait détectée sans attendre le prochain commit.

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  schedule:
    - cron: '23 4 * * 1'      # chaque lundi, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Dépendances de développement
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Ruff
        run: ruff check --output-format=github .

  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Dépendances
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Outils de comparaison
        shell: bash
        run: |
          cat > /tmp/hashs.sh <<'SH'
          # Empreintes de tous les livrables générés (hors .git).
          {
            find . -type f \( -name '*.xlsx' -o -name '*.csv' -o -name '*.json' \
                 -o -name '*.geojson' -o -name '*.html' -o -name '*.webp' \) \
                 -not -path './.git/*' -print0 | sort -z | xargs -0 sha256sum
          } > "$1"
          SH
          chmod +x /tmp/hashs.sh

      - name: Construction (1re passe)
        run: |
          python construire_base.py
          /tmp/hashs.sh /tmp/h1.txt

      - name: Idempotence — deux constructions donnent des octets identiques
        run: |
          # Constat #7 : relancer la génération ne doit RIEN changer (plus de
          # « Généré le… » horodaté ni de métadonnée volatile).
          python construire_base.py
          /tmp/hashs.sh /tmp/h2.txt
          if ! diff -u /tmp/h1.txt /tmp/h2.txt; then
            echo "::error::La 2e construction modifie des livrables: génération non idempotente."
            exit 1
          fi
          echo "✔ Deux constructions successives produisent des octets identiques."

      - name: Les livrables données/code commités sont à jour
        run: |
          # Tous les livrables texte/données (xlsx inclus) doivent être
          # reproductibles et à jour par rapport à la source data/.csv.
          # Exception : la planche contact WebP est une image compressée par
          # libwebp natif, dont les octets varient selon le codec du runner ;
          # son idempotence est garantie par l'étape précédente (même runner),
          # pas par comparaison binaire inter-environnements.
          fichiers=$(git diff --name-only -- . \
            ':(exclude)portraits/planche-contact-generale.webp')
          if [ -n "$fichiers" ]; then
            echo "$fichiers" | while read -r f; do
              echo "::error file=${f}::livrable non régénéré/non reproductible (lancez construire_base.py et committez)"
            done
            git diff --numstat -- . ':(exclude)portraits/planche-contact-generale.webp'
            exit 1
          fi
          echo "✔ Livrables données/code à jour et reproductibles."

      - name: La narration est versionnée
        run: |
          # La narration (factions, répliques, arcs) est publique depuis le
          # 2026-09-13 : la source doit vivre dans le dépôt, sinon le classeur
          # ne peut pas être régénéré.
          if ! git ls-files --error-unmatch data/narration.csv > /dev/null 2>&1; then
            echo "::error::data/narration.csv n'est pas commité : la narration est publique et versionnée."
            exit 1
          fi
          echo "✔ Narration versionnée dans le dépôt (source publique)."

      - name: Garde-fous (tests)
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Régressions JavaScript de la carte
        run: node --test tests/carte.test.cjs

  navigateur:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dépendances des tests navigateur
        run: npm ci
      - name: Chromium et bibliothèques système
        run: npx playwright install --with-deps chromium
      - name: Parcours navigateur sur les deux cartes
        run: npm run test:e2e
      - name: Rapport et traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-navigateur
          path: |
            playwright-report/
            test-results/
          retention-days: 7
