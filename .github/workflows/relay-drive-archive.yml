name: Relay shared Drive archive

# Telecharge l'archive partagee sur Google Drive (inaccessible depuis le sandbox)
# et la publie sous un tag git temporaire, seul canal joignable depuis le sandbox
# (github.com en git + api.github.com). Le tag est supprime apres recuperation.

on:
  push:
    branches:
      - arena/01a097bf-base-donnee
    paths:
      - .github/workflows/relay-drive-archive.yml
  workflow_dispatch:
    inputs:
      file_id:
        description: 'ID du fichier Google Drive'
        required: false
        default: '1PWkzbuQlXFVVghd-vlRe46QvvwXA5K7c'

permissions:
  contents: write

concurrency:
  group: relay-drive-archive
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download archive from Google Drive
        env:
          FILE_ID: ${{ github.event.inputs.file_id || '1PWkzbuQlXFVVghd-vlRe46QvvwXA5K7c' }}
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/workspace.zip"
          ok=0

          try() {
            local label="$1"; shift
            echo "::group::${label}"
            rm -f "$out"
            if "$@" && [ -s "$out" ] && unzip -t "$out" >/dev/null 2>&1; then
              echo "SUCCESS via ${label}"
              ok=1
            else
              echo "FAILED via ${label}"
            fi
            echo "::endgroup::"
          }

          try "drive.usercontent.google.com (confirm=t)" \
            curl --fail --location --retry 3 --retry-delay 3 --max-time 900 \
                 --output "$out" \
                 "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t&authuser=0"

          if [ "$ok" -eq 0 ]; then
            try "drive.google.com/uc (confirm=t)" \
              curl --fail --location --retry 3 --retry-delay 3 --max-time 900 \
                   --output "$out" \
                   "https://drive.google.com/uc?export=download&id=${FILE_ID}&confirm=t"
          fi

          if [ "$ok" -eq 0 ]; then
            echo "::group::gdown"
            python3 -m pip install --quiet --upgrade gdown || true
            if gdown --id "$FILE_ID" -O "$out" && unzip -t "$out" >/dev/null 2>&1; then
              ok=1; echo "SUCCESS via gdown"
            else
              echo "FAILED via gdown"
            fi
            echo "::endgroup::"
          fi

          if [ "$ok" -eq 0 ]; then
            echo "Aucune methode de telechargement n'a fonctionne."
            head -c 600 "$out" 2>/dev/null || true
            exit 1
          fi

          echo "Archive telechargee:"
          ls -l "$out"

      - name: Build manifest
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/workspace.zip"
          drop="${RUNNER_TEMP}/drop"
          rm -rf "$drop"; mkdir -p "$drop"
          cp "$out" "$drop/workspace-01a095f8.zip"
          {
            echo "source: Google Drive file 1PWkzbuQlXFVVghd-vlRe46QvvwXA5K7c"
            echo "folder: 1abzR2Imi0v-flhoUk1KgB2u_yCpr0fQb"
            echo "name: workspace-01a095f8-a934-72fe-98db-28fcc74cd1ec.zip"
            echo "fetched_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "size_bytes: $(stat -c %s "$drop/workspace-01a095f8.zip")"
            echo "sha256: $(sha256sum "$drop/workspace-01a095f8.zip" | cut -d' ' -f1)"
            echo
            echo "== zip integrity =="
            unzip -t "$drop/workspace-01a095f8.zip" | tail -n 2
            echo
            echo "== entry count =="
            unzip -Z1 "$drop/workspace-01a095f8.zip" | wc -l
            echo
            echo "== top-level entries =="
            unzip -Z1 "$drop/workspace-01a095f8.zip" | awk -F/ '{print $1}' | sort -u | head -n 60
            echo
            echo "== full listing (first 4000 lines) =="
            unzip -Z1 "$drop/workspace-01a095f8.zip" | head -n 4000
          } > "$drop/MANIFEST.txt"
          echo "--- MANIFEST (head) ---"
          head -n 40 "$drop/MANIFEST.txt"

      - name: Publish as temporary git tag
        run: |
          set -euo pipefail
          drop="${RUNNER_TEMP}/drop"
          tag="drive-drop-${GITHUB_RUN_ID}"
          cd "$drop"
          git init -q .
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(relay): temporary drop of shared Drive archive

Archive Google Drive workspace-01a095f8-a934-72fe-98db-28fcc74cd1ec.zip
publiee temporairement sous le tag ${tag} pour transfert vers le sandbox.
Ce tag est supprime apres recuperation."
          git tag -f "$tag"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin "refs/tags/${tag}"
          echo "Pousse: refs/tags/${tag}"
