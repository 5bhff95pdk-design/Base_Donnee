# Crochets pre-commit :  pre-commit install  (une seule fois)
#
# Rien de cosmétique, et surtout RIEN qui touche aux livrables générés
# (xlsx / csv / json / geojson / html / webp) : construire_base.py les réécrit
# sans newline finale, un « end-of-file-fixer » les rendrait non reproductibles.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        files: \.(py|md|yml|yaml|txt|toml)$
      - id: trailing-whitespace
        files: \.(py|md|yml|yaml|txt|toml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
